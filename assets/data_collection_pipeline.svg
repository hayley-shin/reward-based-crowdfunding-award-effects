<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
  <title id="title">Data Collection and Construction Pipeline</title>
  <desc id="desc">Six-stage pipeline from crowdfunding campaign listings to a creator by campaign by date panel for empirical analysis.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#10233f}
      .subtitle{font:400 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#64748b}
      .step{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#10233f}
      .body{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#334155}
      .small{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#475569}
      .num{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:white;text-anchor:middle;dominant-baseline:middle}
      .icon{fill:none;stroke:#18324f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .divider{stroke:#cbd5e1;stroke-width:1.5}
      .arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="720" fill="#ffffff"/>
  <text x="900" y="64" text-anchor="middle" class="title">Data Collection and Construction Pipeline</text>
  <text x="900" y="101" text-anchor="middle" class="subtitle">From raw platform data to a creator–campaign–date panel for empirical analysis</text>

  <!-- arrows -->
  <path class="arrow" d="M238 365 H258"/><path class="arrow" d="M458 365 H478"/><path class="arrow" d="M688 365 H708"/><path class="arrow" d="M1288 365 H1308"/><path class="arrow" d="M1518 365 H1538"/>

  <!-- 1 -->
  <rect x="30" y="155" width="208" height="430" rx="16" fill="#eef6ff" stroke="#a8cdf5" stroke-width="1.5"/>
  <circle cx="62" cy="193" r="22" fill="#6f9fd1"/><text x="62" y="194" class="num">1</text>
  <text x="95" y="188" class="step"><tspan x="95">Initial Campaign</tspan><tspan x="95" dy="24">Listings</tspan></text>
  <rect x="87" y="258" width="94" height="70" rx="4" class="icon"/><line x1="87" y1="277" x2="181" y2="277" class="icon"/><circle cx="101" cy="268" r="2" fill="#18324f"/><line x1="105" y1="294" x2="161" y2="294" class="icon"/><line x1="105" y1="307" x2="153" y2="307" class="icon"/>
  <line x1="48" y1="365" x2="220" y2="365" class="divider"/>
  <text x="50" y="403" class="body"><tspan x="50">Collect campaign listings</tspan><tspan x="50" dy="23">from platform pages and</tspan><tspan x="50" dy="23">API endpoints</tspan></text>

  <!-- 2 -->
  <rect x="258" y="155" width="200" height="430" rx="16" fill="#effaf3" stroke="#b5dfc5" stroke-width="1.5"/>
  <circle cx="290" cy="193" r="22" fill="#70ae87"/><text x="290" y="194" class="num">2</text>
  <text x="323" y="188" class="step"><tspan x="323">Creator</tspan><tspan x="323" dy="24">Identification</tspan></text>
  <circle cx="358" cy="280" r="21" fill="#18324f" opacity=".85"/><circle cx="325" cy="288" r="14" fill="#18324f" opacity=".75"/><circle cx="391" cy="288" r="14" fill="#18324f" opacity=".75"/><path d="M326 327c3-20 18-31 32-31s29 11 32 31" fill="#18324f" opacity=".85"/>
  <line x1="276" y1="365" x2="440" y2="365" class="divider"/>
  <text x="278" y="403" class="body"><tspan x="278">Identify the creator</tspan><tspan x="278" dy="23">associated with each</tspan><tspan x="278" dy="23">campaign</tspan></text>

  <!-- 3 -->
  <rect x="478" y="155" width="210" height="430" rx="16" fill="#fff9e9" stroke="#edd69a" stroke-width="1.5"/>
  <circle cx="510" cy="193" r="22" fill="#d9b451"/><text x="510" y="194" class="num">3</text>
  <text x="543" y="188" class="step"><tspan x="543">Creator Campaign</tspan><tspan x="543" dy="24">Histories</tspan></text>
  <ellipse cx="583" cy="270" rx="42" ry="15" class="icon"/><path d="M541 270v54c0 9 19 16 42 16s42-7 42-16v-54" class="icon"/><path d="M541 296c0 9 19 16 42 16s42-7 42-16" class="icon"/>
  <line x1="496" y1="365" x2="670" y2="365" class="divider"/>
  <text x="498" y="403" class="body"><tspan x="498">Retrieve each creator’s</tspan><tspan x="498" dy="23">past campaigns to build</tspan><tspan x="498" dy="23">campaign histories</tspan></text>

  <!-- 4 -->
  <rect x="708" y="155" width="580" height="430" rx="16" fill="#fff3f3" stroke="#efb8bb" stroke-width="1.5"/>
  <circle cx="740" cy="193" r="22" fill="#c9787e"/><text x="740" y="194" class="num">4</text>
  <text x="775" y="199" class="step">Collect Detailed Information from Multiple Sources</text>
  <line x1="708" y1="235" x2="1288" y2="235" stroke="#efc5c7"/>
  <line x1="853" y1="235" x2="853" y2="565" stroke="#efc5c7"/><line x1="998" y1="235" x2="998" y2="565" stroke="#efc5c7"/><line x1="1143" y1="235" x2="1143" y2="565" stroke="#efc5c7"/>
  <text x="780" y="280" text-anchor="middle" class="step"><tspan x="780">Campaign</tspan><tspan x="780" dy="22">Characteristics</tspan></text>
  <text x="925" y="280" text-anchor="middle" class="step"><tspan x="925">Daily Campaign</tspan><tspan x="925" dy="22">Activity</tspan></text>
  <text x="1070" y="280" text-anchor="middle" class="step"><tspan x="1070">Creator</tspan><tspan x="1070" dy="22">Characteristics</tspan></text>
  <text x="1215" y="280" text-anchor="middle" class="step"><tspan x="1215">Platform Award</tspan><tspan x="1215" dy="22">Information</tspan></text>
  <text x="730" y="340" class="small"><tspan x="730">• category</tspan><tspan x="730" dy="23">• funding goal</tspan><tspan x="730" dy="23">• campaign period</tspan><tspan x="730" dy="23">• reward structure</tspan><tspan x="730" dy="23">• amount raised</tspan></text>
  <text x="875" y="340" class="small"><tspan x="875">• daily backer count</tspan><tspan x="875" dy="23">• daily amount raised</tspan><tspan x="875" dy="23">• campaign updates</tspan><tspan x="875" dy="23">• engagement measures</tspan></text>
  <text x="1020" y="340" class="small"><tspan x="1020">• creator attributes</tspan><tspan x="1020" dy="23">• past performance</tspan><tspan x="1020" dy="23">• historical activity</tspan></text>
  <text x="1165" y="340" class="small"><tspan x="1165">• award recipients</tspan><tspan x="1165" dy="23">• award categories</tspan><tspan x="1165" dy="23">• award timing</tspan></text>

  <!-- 5 -->
  <rect x="1308" y="155" width="210" height="430" rx="16" fill="#f4f3ff" stroke="#c8c3ef" stroke-width="1.5"/>
  <circle cx="1340" cy="193" r="22" fill="#8079b9"/><text x="1340" y="194" class="num">5</text>
  <text x="1373" y="188" class="step"><tspan x="1373">Data Integration</tspan><tspan x="1373" dy="24">and Cleaning</tspan></text>
  <circle cx="1412" cy="292" r="27" fill="none" stroke="#18324f" stroke-width="10" stroke-dasharray="10 5"/><circle cx="1452" cy="260" r="17" fill="none" stroke="#18324f" stroke-width="8" stroke-dasharray="8 4"/>
  <line x1="1326" y1="365" x2="1500" y2="365" class="divider"/>
  <text x="1328" y="403" class="body"><tspan x="1328">Merge by creator and</tspan><tspan x="1328" dy="23">campaign identifiers</tspan><tspan x="1328" dy="23">Align observations by date</tspan><tspan x="1328" dy="23">Construct analysis variables</tspan></text>

  <!-- 6 -->
  <rect x="1538" y="155" width="232" height="430" rx="16" fill="#eefafa" stroke="#a8d8da" stroke-width="1.5"/>
  <circle cx="1570" cy="193" r="22" fill="#5ea2a5"/><text x="1570" y="194" class="num">6</text>
  <text x="1603" y="188" class="step"><tspan x="1603">Final Analysis</tspan><tspan x="1603" dy="24">Dataset</tspan></text>
  <ellipse cx="1654" cy="273" rx="40" ry="14" class="icon"/><path d="M1614 273v55c0 8 18 15 40 15s40-7 40-15v-55" class="icon"/><path d="M1614 299c0 8 18 15 40 15s40-7 40-15" class="icon"/>
  <rect x="1555" y="374" width="198" height="72" rx="10" fill="#d9f1ef" stroke="#a8d8da"/>
  <text x="1654" y="402" text-anchor="middle" class="step"><tspan x="1654">Creator × Campaign × Date</tspan><tspan x="1654" dy="24">Panel</tspan></text>
  <text x="1654" y="486" text-anchor="middle" class="body"><tspan x="1654">Panel data tracking daily</tspan><tspan x="1654" dy="23">campaign dynamics and</tspan><tspan x="1654" dy="23">creator activity</tspan></text>
</svg>
